name: Causal design checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.2.6 \
            pandas==2.3.3 \
            scipy==1.15.3 \
            scikit-learn==1.7.2 \
            statsmodels==0.14.5 \
            pmdarima==2.1.1 \
            requests==2.32.5 \
            openpyxl==3.1.5 \
            pytest==8.3.5
      - name: Enforce causal timing tests
        run: python -m pytest -q tests
      - name: Check public-data downloader imports on Python 3.10
        run: python -c "import sys; sys.path.insert(0, 'code'); import data_sources.download_public_inputs"
